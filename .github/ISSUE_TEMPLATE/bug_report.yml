name: Bug Report
description: Something does not work as documented
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. A minimal Markdown file or config that shows it is the most useful thing you can attach.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: eziwiki version
      description: For a scaffolded wiki, `eziwiki.version` in your `package.json`; for a clone of this repository, the commit.
      placeholder: 0.5.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v20.19.1
  - type: dropdown
    id: setup
    attributes:
      label: Where does it happen?
      options:
        - A wiki created with `npx create-eziwiki`
        - A clone of this repository
        - Both
  - type: dropdown
    id: where
    attributes:
      label: When does it happen?
      options:
        - During `npm run build`
        - In `npm run dev`
        - On the published site
        - In the scaffolder itself
