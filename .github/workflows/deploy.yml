name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Full history, not the single commit a checkout fetches by default: a
      # page with no `updated` in its frontmatter is dated from the last commit
      # that touched it. In a shallow clone the oldest commit has no parent,
      # so git lists every file that existed then as if that commit had
      # written it — a page from years ago would be dated today. The build
      # notices a shallow clone and dates nothing rather than that, so without
      # this the site would simply carry no dates.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      # GitHub Pages serves a project site from /<repository>, so every emitted
      # path needs that prefix — and a user site (<user>.github.io) from the
      # root, so it needs none. Taken from the repository's name rather than
      # written in, so a fork deploys under its own. Set here rather than
      # inferred from CI, so that test and lint jobs are unaffected.
      - name: Resolve base path
        id: base
        run: |
          # A repository variable BASE_PATH overrides the guess — set it to
          # "/" for a project site on a custom domain, which is served from
          # the root of that domain.
          if [ -n "${{ vars.BASE_PATH }}" ]; then
            p="${{ vars.BASE_PATH }}"
            [ "$p" = "/" ] && p=""
            echo "path=$p" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.repository.name }}" in
              *.github.io) echo "path=" >> "$GITHUB_OUTPUT" ;;
              *) echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      #
      # `NEXT_PUBLIC_SITE_URL` is deliberately not set. This deployment is a
      # mirror of the production site on Vercel, so it keeps the payload's
      # `baseUrl` and canonicalises to Vercel rather than to itself: two copies
      # each claiming to be the original would compete for the same searches.
      # Only the base path differs, which is what keeps assets resolving here.
      - name: Build with Next.js
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
