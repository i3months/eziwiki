name: Release

# Publishes `create-eziwiki` when a `v*` tag is pushed. The tag has to match
# the package's version, so a release is one `npm version` and one `git push
# --follow-tags`, and the published tarball carries provenance back to the
# commit it was built from.
#
# Authenticates by npm trusted publishing — no token, no secret. The one-time
# setup lives on npmjs.com: the package's Settings → Trusted Publisher →
# GitHub Actions, with this repository and `release.yml` as the workflow.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish create-eziwiki
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 for its npm 11; trusted publishing needs npm 11.5 or later,
      # and the update below covers a runner image that lags.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches the package version
        run: |
          version="$(node -p "require('./packages/create-eziwiki/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match create-eziwiki ${version}" >&2
            exit 1
          fi

      # `prepack` rebuilds the template from this checkout; the tests run
      # against it before anything is published.
      - name: Build and test the template
        run: |
          npm run build:template
          npx vitest --run packages/create-eziwiki/lib

      - name: Publish
        working-directory: packages/create-eziwiki
        run: npm publish --provenance --access public
