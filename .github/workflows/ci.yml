name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Nothing here writes to the repository; the default token would let it.
permissions:
  contents: read

# A pull request pushed twice in a minute needs one run, not two.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Format & Types
    runs-on: ubuntu-latest
    # No job here takes more than a few minutes; a hung one held a runner
    # for six hours before this.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `lint` no longer passes --fix: a CI step that repairs its own input can
      # pass while leaving the committed code broken.
      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run Type Check
        run: npm run type-check

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # No job here takes more than a few minutes; a hung one held a runner
    # for six hours before this.
    timeout-minutes: 15

    # The floor the manifest declares, and the current LTS above it.
    strategy:
      matrix:
        node: [22, 24]

    steps:
      # Full history: the tests that date pages from their commits fail in
      # the single-commit clone a checkout makes by default, since a shallow
      # clone is deliberately left undated.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    # No job here takes more than a few minutes; a hung one held a runner
    # for six hours before this.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Dangling links only warn during a local build; on a pull request they
      # should block, so the published site never ships one.
      - name: Check content links
        run: npm run check:links -- --strict

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-output
          path: out
          retention-days: 7

  scaffold:
    name: Scaffold a project and build it
    runs-on: ubuntu-latest
    # No job here takes more than a few minutes; a hung one held a runner
    # for six hours before this.
    timeout-minutes: 15

    # The `create-eziwiki` template is generated from this repository's source
    # rather than committed, so nothing in the normal build exercises it. This
    # job creates a project the way a user would and builds it, which is what
    # catches a change here breaking the scaffolded output.
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the CLI template
        run: npm run build:template

      - name: Test the scaffolder
        run: npx vitest --run packages/create-eziwiki/lib

      # Scaffolded outside the checkout, so the new project cannot accidentally
      # resolve anything from this repository's node_modules or config. The
      # argument is a bare name because that is all the CLI accepts.
      - name: Create a project
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/packages/create-eziwiki/bin/create-eziwiki.mjs" ci-scaffold-test

      - name: Install, build and test it
        working-directory: ${{ runner.temp }}/ci-scaffold-test
        run: |
          npm install --no-audit --no-fund
          npm run type-check
          npm test
          npm run build

      - name: Verify the site was actually produced
        working-directory: ${{ runner.temp }}/ci-scaffold-test
        run: |
          test -f out/index.html
          test -f out/search-index.json
          test -f out/intro/index.html
          test -f out/graph/index.html
          echo "Scaffolded site built successfully."
