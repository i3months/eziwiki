name: Deploy to GitHub Pages

# Builds the wiki and publishes `out/` to GitHub Pages on every push to main.
# Enable Pages in the repository settings with "GitHub Actions" as the source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: a page with no `updated` in its frontmatter is dated
      # from the last commit that touched it, and a shallow clone cannot say.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Install dependencies
        run: npm ci

      # A project site is served from /<repository>; a user site
      # (<user>.github.io) from the root. Derived from the repository name so
      # nothing here needs editing.
      - name: Resolve base path
        id: base
        run: |
          # A repository variable BASE_PATH overrides the guess — set it to
          # "/" for a project site on a custom domain, which is served from
          # the root of that domain.
          if [ -n "${{ vars.BASE_PATH }}" ]; then
            p="${{ vars.BASE_PATH }}"
            [ "$p" = "/" ] && p=""
            echo "path=$p" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.repository.name }}" in
              *.github.io) echo "path=" >> "$GITHUB_OUTPUT" ;;
              *) echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
